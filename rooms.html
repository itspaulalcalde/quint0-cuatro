<!DOCTYPE html>
<html lang="en">


<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="widht=device-width, initial-scale=1.0">

    <title>bare studio.</title>

    <meta name="description" content="bare studio. Fine Line Tattoo studio in Copenhage.">

    <link rel="stylesheet" href="css/style.css">

</head>



<body>
    <!--MENÚ-->
    <header class="header">
        <div class="logo">
            <a href="index.html">quinto cuatro.</a>
        </div>

        <button type="button"
                class="menu-btn"
                aria-label="Menu"
                aria-controls="main-menu"
                aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="navigation menu" id="main-menu">
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="rooms.html">ROOMS</a></li>
                <li><a href="about.html">ABOUT</a></li>
            </ul>
        </nav>
    </header>


    <!-- ROOMS -->

    <section class="rooms-section" id="rooms">

        <!-- INTRO -->

        <div class="rooms-header">

            <div class="rooms-top">
                <span>02 / ROOMS</span>
                <span>SELECTED WORK — 2026</span>
            </div>

            <h1>Selected works.</h1>

            <p>
                A collection of ideas, images
                and visual stories.
            </p>

        </div>


        <!-- CATEGORIES -->

        <div class="rooms-tabs">

            <button class="room-tab active"
                    data-room="editorial">
                EDITORIAL DESIGN
            </button>

            <button class="room-tab"
                    data-room="branding">
                BRANDING
            </button>

            <button class="room-tab"
                    data-room="photography">
                PHOTOGRAPHY
            </button>

            <button class="room-tab"
                    data-room="posters">
                POSTER DESIGN
            </button>

            <button class="room-tab"
                    data-room="films">
                SHORT FILMS
            </button>

        </div>


        <!-- EDITORIAL -->

        <div class="room-panel active" id="editorial">

            <div class="room-gallery">

                <img src="images/editorial-01.jpg"
                    alt="Editorial project 1">

                <img src="images/editorial-02.jpg"
                    alt="Editorial project 2">

            </div>

        </div>


        <!-- BRANDING -->

        <div class="room-panel" id="branding">

            <div class="room-gallery">

                <img src="images/branding-01.jpg"
                    alt="Branding project 1">

                <img src="images/branding-02.jpg"
                    alt="Branding project 2">

            </div>

        </div>


        <!-- PHOTOGRAPHY -->

        <div class="room-panel" id="photography">

            <div class="room-gallery">

                <img src="images/photo-01.jpg"
                    alt="Photography 1">

                <img src="images/photo-02.jpg"
                    alt="Photography 2">

            </div>

        </div>


        <!-- POSTER DESIGN -->

        <div class="room-panel" id="posters">

            <div class="room-gallery">

                <img src="images/poster-01.jpg"
                    alt="Poster project 1">

                <img src="images/poster-02.jpg"
                    alt="Poster project 2">

            </div>

        </div>


        <!-- SHORT FILMS -->

        <div class="room-panel" id="films">

            <div class="room-gallery">

                <img src="images/film-01.jpg"
                    alt="Short film project">

            </div>

        </div>


        <!-- BOTTOM -->

        <div class="rooms-bottom">

            <span>VISUAL ARCHIVE / 2026</span>
            <span>MADE WITH INTENTION</span>

        </div>

    </section>




    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/script.js"></script>


</body>

</html>
